---
# Weekly scan of the whole history for credentials TruffleHog can verify as live. The commit hook and the lint job
# scan new changes with betterleaks; this catches what got in before them, or past a hook someone skipped.

name: Secret History Scan

on:
  schedule:
    - cron: "45 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the full history
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan the history for verified secrets
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          # renovate: datasource=github-releases depName=trufflesecurity/trufflehog extractVersion=^v(?<version>.+)$
          version: 3.99.8
          extra_args: --results=verified
